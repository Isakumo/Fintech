<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Beneficiaries - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">Beneficiaries</h2>
    <div class="mb-4 flex gap-2">
      <input id="bq" placeholder="Search beneficiaries" class="border rounded px-3 py-2 flex-1">
      <button id="addBtn" class="px-3 py-2 bg-green-600 text-white rounded">Add</button>
    </div>
    <div id="bList" class="space-y-3"></div>
    <div id="addForm" class="hidden bg-white p-4 rounded shadow mt-4">
      <input id="bn" placeholder="Full name" class="w-full border rounded px-3 py-2 mb-2">
      <input id="bb" placeholder="Bank" class="w-full border rounded px-3 py-2 mb-2">
      <input id="ba" placeholder="Account number" class="w-full border rounded px-3 py-2 mb-2">
      <div class="flex gap-2"><button id="saveB" class="px-3 py-2 bg-green-600 text-white rounded">Save</button><button id="cancelB" class="px-3 py-2 border rounded">Cancel</button></div>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      const list = document.getElementById('bList');
      const render = ()=>{
        const arr = JSON.parse(localStorage.getItem('ft_beneficiaries')||'[]');
        list.innerHTML=''; if(!arr.length) list.innerHTML='<div class="text-sm text-slate-500">No beneficiaries yet.</div>';
        arr.forEach((b,i)=>{
          const el = document.createElement('div');
          el.className='bg-white p-3 rounded shadow flex justify-between items-center';
          el.innerHTML = `<div><div class="font-medium">${b.name}</div><div class="text-sm text-slate-500">${b.bank} • ${b.account}</div></div><div class="flex gap-2"><button class="px-2 py-1 bg-green-600 text-white rounded" data-i="${i}">Quick Transfer</button><button class="px-2 py-1 border rounded" data-del="${i}">Delete</button></div>`;
          list.appendChild(el);
        });
      };
      render();
      document.getElementById('addBtn').addEventListener('click', ()=> document.getElementById('addForm').classList.remove('hidden'));
      document.getElementById('cancelB').addEventListener('click', ()=> document.getElementById('addForm').classList.add('hidden'));
      document.getElementById('saveB').addEventListener('click', ()=>{
        const b={name:document.getElementById('bn').value, bank:document.getElementById('bb').value, account:document.getElementById('ba').value};
        const arr = JSON.parse(localStorage.getItem('ft_beneficiaries')||'[]'); arr.push(b); localStorage.setItem('ft_beneficiaries', JSON.stringify(arr)); render(); document.getElementById('addForm').classList.add('hidden');
      });
      list.addEventListener('click', e=>{
        if(e.target.dataset.del){ const i = +e.target.dataset.del; const arr = JSON.parse(localStorage.getItem('ft_beneficiaries')||'[]'); arr.splice(i,1); localStorage.setItem('ft_beneficiaries', JSON.stringify(arr)); render(); }
        if(e.target.dataset.i){ const i = +e.target.dataset.i; const b = JSON.parse(localStorage.getItem('ft_beneficiaries')||'[]')[i]; if(b) { localStorage.setItem('ft_prefill', JSON.stringify(b)); location.href='transfer.html'; } }
      });
      document.getElementById('bq').addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); const arr = JSON.parse(localStorage.getItem('ft_beneficiaries')||'[]').filter(x=> (x.name||'').toLowerCase().includes(q) || (x.account||'').includes(q)); list.innerHTML=''; arr.forEach((b,i)=>{ const el=document.createElement('div'); el.className='bg-white p-3 rounded shadow flex justify-between items-center'; el.innerHTML = `<div><div class='font-medium'>${b.name}</div><div class='text-sm text-slate-500'>${b.bank} • ${b.account}</div></div><div class='flex gap-2'><button class='px-2 py-1 bg-green-600 text-white rounded' data-i='${i}'>Quick Transfer</button><button class='px-2 py-1 border rounded' data-del='${i}'>Delete</button></div>`; list.appendChild(el); }); });
    });
  </script>
</body>
</html>
