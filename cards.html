<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cards - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-4xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">Virtual Cards</h2>
    <div id="cardsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      
      // Check if user is logged in
      if (!isLoggedIn()) {
        Toast.error('Please login first');
        setTimeout(() => location.href = 'login.html', 1000);
        return;
      }
      
      const cards = JSON.parse(localStorage.getItem('ft_cards')||'[]');
      const el = document.getElementById('cardsList');
      
      if(!cards.length) {
        el.innerHTML = '<div class="text-sm text-slate-500 col-span-2 text-center py-8">No virtual cards yet. <a href="dashboard.html" class="text-green-600 hover:underline">Back to dashboard</a></div>';
        return;
      }
      
      cards.forEach(c=>{
        const card = document.createElement('div');
        card.className='bg-white p-4 rounded shadow';
        card.innerHTML = `
          <div class="text-sm text-slate-500">${c.type||'VISA'}</div>
          <div class="font-semibold text-lg mt-2">**** **** **** ${String(c.pan).slice(-4)}</div>
          <div class="mt-2 text-sm">
            <div class="text-slate-600">Balance: ₦${Number(c.balance||0).toLocaleString()}</div>
            <div class="text-slate-600">Exp: ${c.expiry || '--/--'}</div>
          </div>
        `;
        el.appendChild(card);
      });
    });
  </script>
</body>
</html>
