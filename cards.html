<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cards - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-4xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">Cards</h2>
    <div id="cardsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      const cards = JSON.parse(localStorage.getItem('ft_cards')||'[]');
      const el = document.getElementById('cardsList');
      if(!cards.length) el.innerHTML = '<div class="text-sm text-slate-500">No virtual cards.</div>';
      cards.forEach(c=>{
        const card = document.createElement('div'); card.className='bg-white p-4 rounded shadow';
        card.innerHTML = `<div class="text-sm text-slate-500">${c.type||'VISA'}</div><div class="font-semibold text-lg">**** **** **** ${String(c.pan).slice(-4)}</div><div class="mt-2 text-sm">Balance: ₦${Number(c.balance||0).toLocaleString()}</div><div class="mt-3 flex gap-2"><button class="px-3 py-1 border rounded">Freeze</button><button class="px-3 py-1 bg-green-600 text-white rounded">Details</button></div>`;
        el.appendChild(card);
      });
    });
  </script>
</body>
</html>
