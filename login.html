<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
  <div id="navbar"></div>
  <div class="w-full max-w-md p-6 mx-auto">
    <div class="text-center mb-6">
      <img src="assets/images/logo.png" class="mx-auto w-16 h-16" alt="logo">
      <h2 class="text-2xl font-bold text-green-600 mt-2">Axpress</h2>
    </div>
    <form id="loginForm" class="bg-white shadow rounded p-6">
      <label class="block text-sm font-medium text-slate-700">Email or Phone</label>
      <input id="username" name="identifier" class="mt-1 block w-full rounded border px-3 py-2" required>
      <label class="block text-sm font-medium text-slate-700 mt-4">Password</label>
      <input id="password" name="password" type="password" class="mt-1 block w-full rounded border px-3 py-2" required>
      <div class="flex items-center justify-between mt-4">
        <label class="flex items-center gap-2 text-sm"><input id="remember" type="checkbox"> Remember me</label>
        <a href="forgot-password.html" class="text-sm text-green-600">Forgot?</a>
      </div>
      <div id="loginMsg" class="text-sm text-red-600 mt-3" role="status" aria-live="polite"></div>
      <button class="w-full mt-3 bg-green-600 text-white py-2 rounded" type="submit">Login</button>
      <p class="text-center text-sm mt-4">Don't have an account? <a href="register.html" class="text-green-600">Create Account</a></p>
    </form>
    <div class="mt-4 text-xs text-slate-500 text-center">
      Demo credentials — Email: <strong>demo@axpress.test</strong> | Phone: <strong>08000000000</strong> — Password: <strong>demo1234</strong>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    loadComponent('components/navbar.html','#navbar');
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const id = document.getElementById('username').value.trim();
      const pw = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      msg.textContent = '';
      try{
        const acct = await validateLogin(id, pw);
        if(!acct) { msg.textContent = 'Invalid credentials'; return; }
        setCurrentUser({id:acct.id, name:acct.name, email:acct.email, contact:acct.contact});
        location.href = 'dashboard.html';
      }catch(err){ msg.textContent = err.message; }
    });
  </script>
</body>
</html>
