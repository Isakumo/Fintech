<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transaction Details - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <button onclick="history.back()" class="text-sm text-green-600 mb-4">← Back</button>
    <div id="details" class="bg-white p-4 rounded shadow"></div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      
      // Get transaction from sessionStorage (passed by dashboard)
      let t = JSON.parse(sessionStorage.getItem('selectedTransaction')||'null');
      
      // Fallback: search localStorage
      if(!t){
        const all = JSON.parse(localStorage.getItem('ft_transactions')||'[]');
        t = all.find(x=> x.id === id);
      }
      
      // Final fallback: search hardcoded dashboard transactions (for refresh/direct navigation)
      if(!t){
        const defaultTransactions = [
          { id: 'TRF-001', recipient: 'Card Withdrawal', bank: 'Opay', amount: 50000, date: '2026-07-25', type: 'credit', status: 'successful', narration: 'ATM Withdrawal' },
          { id: 'TRF-002', recipient: 'Ibrahim Rabi Abdullahi', bank: 'First Bank of Nigeria', amount: 750000, date: '2026-07-25', type: 'debit', status: 'successful', narration: 'Transfer' },
          { id: 'TRF-003', recipient: 'Usman Sani', bank: 'Zenith Bank', amount: 75000, date: '2026-07-25', type: 'credit', status: 'successful', narration: 'Deposit' },
          { id: 'TRF-004', recipient: 'Bello Ahmad', bank: 'Access Bank', amount: 15000, date: '2026-07-25', type: 'debit', status: 'successful', narration: 'Payment' },
          { id: 'TRF-005', recipient: 'Card Withdrawal', bank: 'Moniepoint', amount: 120000, date: '2026-07-24', type: 'credit', status: 'successful', narration: 'Withdrawal' },
          { id: 'TRF-006', recipient: 'Fatima Bello', bank: 'Opay', amount: 35000, date: '2026-07-25', type: 'debit', status: 'successful', narration: 'Transfer' },
          { id: 'TRF-007', recipient: 'Card Withdrawal', bank: 'United Bank For Africa', amount: 600000, date: '2026-07-25', type: 'credit', status: 'successful', narration: 'Deposit' },
          { id: 'TRF-008', recipient: 'Isah Abdullahi', bank: 'Opay', amount: 45000, date: '2026-07-25', type: 'debit', status: 'successful', narration: 'Transfer' }
        ];
        t = defaultTransactions.find(x=> x.id === id);
      }
      
      const el = document.getElementById('details');
      if(!t) { 
        el.innerHTML = '<div class="text-sm">Transaction not found.</div>'; 
        return;
      }
      
      el.innerHTML = `
        <h3 class="text-lg font-semibold mb-2">${t.recipient}</h3>
        <div class="text-sm text-slate-600 mb-4">${t.bank} • ${t.date}</div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="p-2 bg-slate-50 rounded">Amount</div><div class="p-2">₦${Number(t.amount).toLocaleString()}</div>
          <div class="p-2 bg-slate-50 rounded">Status</div><div class="p-2">${t.status || 'successful'}</div>
          <div class="p-2 bg-slate-50 rounded">Reference</div><div class="p-2">${t.id}</div>
          <div class="p-2 bg-slate-50 rounded">Narration</div><div class="p-2">${t.narration||'-'}</div>
        </div>
        <div class="mt-4 flex gap-2">
          <button onclick="window.print()" class="px-3 py-2 bg-white border rounded">Print Receipt</button>
          <a href="reciep_printout.html" class="px-3 py-2 bg-green-600 text-white rounded">Open Receipt</a>
        </div>
      `;
    });
  </script>
</body>
</html>
