<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transaction Details - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <button onclick="history.back()" class="text-sm text-green-600 mb-4">← Back</button>
    <div id="details" class="bg-white p-4 rounded shadow"></div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const all = JSON.parse(localStorage.getItem('ft_transactions')||'[]');
      const t = all.find(x=> x.id === id) || JSON.parse(localStorage.getItem('ft_last')||'null');
      const el = document.getElementById('details');
      if(!t) { el.innerHTML = '<div class="text-sm">Transaction not found.</div>'; return }
      el.innerHTML = `
        <h3 class="text-lg font-semibold mb-2">${t.recipient}</h3>
        <div class="text-sm text-slate-600 mb-4">${t.bank} • ${t.date}</div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="p-2 bg-slate-50 rounded">Amount</div><div class="p-2">₦${Number(t.amount).toLocaleString()}</div>
          <div class="p-2 bg-slate-50 rounded">Status</div><div class="p-2">${t.status}</div>
          <div class="p-2 bg-slate-50 rounded">Reference</div><div class="p-2">${t.id}</div>
          <div class="p-2 bg-slate-50 rounded">Narration</div><div class="p-2">${t.narration||'-'}</div>
        </div>
        <div class="mt-4 flex gap-2">
          <button onclick="window.print()" class="px-3 py-2 bg-white border rounded">Print Receipt</button>
          <a href="reciep_printout.html" class="px-3 py-2 bg-green-600 text-white rounded">Open Receipt</a>
        </div>
      `;
    });
  </script>
</body>
</html>
