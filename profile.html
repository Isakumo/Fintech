<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">Profile</h2>
    <div class="bg-white p-4 rounded shadow">
      <div class="mb-3 pb-3 border-b">
        <label class="text-sm text-slate-500">Full Name</label>
        <div id="pname" class="text-lg font-medium">-</div>
      </div>
      <div class="mb-3 pb-3 border-b">
        <label class="text-sm text-slate-500">Email</label>
        <div id="pemail" class="text-lg font-medium">-</div>
      </div>
      <div class="mb-4 pb-3 border-b">
        <label class="text-sm text-slate-500">Phone</label>
        <div id="pphone" class="text-lg font-medium">-</div>
      </div>
      
      <div class="flex gap-2 mt-6">
        <a href="forgot-password.html" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Change Password</a>
        <button id="logout" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Logout</button>
      </div>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      
      // Check if user is logged in
      if (!isLoggedIn()) {
        Toast.error('Please login first');
        setTimeout(() => location.href = 'login.html', 1000);
        return;
      }
      
      const u = JSON.parse(localStorage.getItem('ft_user')||'{}');
      document.getElementById('pname').textContent = u.name || '-';
      document.getElementById('pemail').textContent = u.email || '-';
      document.getElementById('pphone').textContent = u.contact || '-';
      
      document.getElementById('logout').addEventListener('click', ()=> {
        if (confirm('Are you sure you want to logout?')) {
          localStorage.removeItem('ft_user');
          Toast.success('Logged out successfully');
          setTimeout(() => location.href = 'login.html', 500);
        }
      });
    });
  </script>
</body>
</html>
