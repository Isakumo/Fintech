<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transfer - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">New Transfer</h2>
    <form id="transferForm" class="bg-white p-4 rounded shadow space-y-3">
      <div>
        <label class="block text-sm">Recipient Bank</label>
        <input id="bank" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Recipient Name</label>
        <input id="recipient" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Account Number</label>
        <input id="account" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Amount</label>
        <input id="amount" type="number" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Narration</label>
        <input id="narration" class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      <div class="flex items-center gap-2">
        <input id="saveBeneficiary" type="checkbox">
        <label class="text-sm">Save Beneficiary</label>
      </div>
      <button class="w-full bg-green-600 text-white py-2 rounded" type="submit">Transfer</button>
    </form>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      // prefill from beneficiaries quick transfer
      try{
        const pre = JSON.parse(localStorage.getItem('ft_prefill')||'null');
        if(pre){
          document.getElementById('bank').value = pre.bank || '';
          document.getElementById('recipient').value = pre.name || '';
          document.getElementById('account').value = pre.account || '';
          localStorage.removeItem('ft_prefill');
        }
      }catch(e){}
    });
    document.getElementById('transferForm').addEventListener('submit', function(e){
      e.preventDefault();
      const t = {
        id: 'TRF-'+Date.now().toString(36),
        bank: document.getElementById('bank').value,
        recipient: document.getElementById('recipient').value,
        account: document.getElementById('account').value,
        amount: Number(document.getElementById('amount').value),
        narration: document.getElementById('narration').value,
        date: new Date().toLocaleString(),
        status: 'successful',
        type: 'debit'
      };
      const arr = JSON.parse(localStorage.getItem('ft_transactions')||'[]');
      arr.push(t);
      localStorage.setItem('ft_transactions', JSON.stringify(arr));
      localStorage.setItem('ft_last', JSON.stringify(t));
      location.href = 'reciep_printout.html';
    });
  </script>
</body>
</html>
