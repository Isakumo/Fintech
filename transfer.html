<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transfer - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>
  <main class="p-6 max-w-2xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">New Transfer</h2>
    <form id="transferForm" class="bg-white p-4 rounded shadow space-y-3">
      <div>
        <label class="block text-sm font-medium mb-1">Recipient Bank</label>
        <input id="bank" placeholder="e.g., First Bank Of Nigeria" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      
      <div>
        <label class="block text-sm font-medium mb-1">Recipient Name</label>
        <input id="recipient" placeholder="Full name" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      
      <div>
        <label class="block text-sm font-medium mb-1">Account Number</label>
        <input id="account" placeholder="10+ digits" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      
      <div>
        <label class="block text-sm font-medium mb-1">Amount (₦)</label>
        <input id="amount" type="number" placeholder="0.00" required class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      
      <div>
        <label class="block text-sm font-medium mb-1">Narration (Optional)</label>
        <input id="narration" placeholder="Payment for..." class="mt-1 block w-full rounded border px-3 py-2">
      </div>
      
      <div class="flex items-center gap-2">
        <input id="saveBeneficiary" type="checkbox">
        <label class="text-sm">Save as Beneficiary</label>
      </div>
      
      <div id="transferMsg" class="text-sm text-red-600 hidden"></div>
      <button class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition" type="submit">Transfer</button>
    </form>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      loadComponent('components/navbar.html','#navbar');
      
      // Check if user is logged in
      if (!isLoggedIn()) {
        Toast.error('Please login first');
        setTimeout(() => location.href = 'login.html', 1000);
        return;
      }
      
      // prefill from beneficiaries quick transfer
      try{
        const pre = JSON.parse(localStorage.getItem('ft_prefill')||'null');
        if(pre){
          document.getElementById('bank').value = pre.bank || '';
          document.getElementById('recipient').value = pre.name || '';
          document.getElementById('account').value = pre.account || '';
          localStorage.removeItem('ft_prefill');
        }
      }catch(e){}
    });
    
    document.getElementById('transferForm').addEventListener('submit', function(e){
      e.preventDefault();
      clearAllErrors();
      const transferMsg = document.getElementById('transferMsg');
      transferMsg.classList.add('hidden');
      
      const bank = document.getElementById('bank').value.trim();
      const recipient = document.getElementById('recipient').value.trim();
      const account = document.getElementById('account').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const narration = document.getElementById('narration').value.trim();
      
      try {
        // Validate transfer
        const errors = validateTransfer({bank, recipient, account, amount, narration});
        if (Object.keys(errors).length > 0) {
          const firstError = Object.values(errors)[0];
          transferMsg.textContent = firstError;
          transferMsg.classList.remove('hidden');
          
          // Highlight error fields
          Object.keys(errors).forEach(key => {
            const fieldId = key === 'bank' ? 'bank' : 
                           key === 'recipient' ? 'recipient' : 
                           key === 'account' ? 'account' : 'amount';
            setFieldError(fieldId, errors[key]);
          });
          Toast.error(firstError);
          return;
        }
        
        // Create transaction
        const t = {
          id: 'TRF-'+Date.now().toString(36),
          bank: bank,
          recipient: recipient,
          account: account,
          amount: Number(amount),
          narration: narration,
          date: new Date().toLocaleString(),
          status: 'successful',
          type: 'debit'
        };
        
        addTransaction(t);
        
        // Save beneficiary if checked
        if (document.getElementById('saveBeneficiary').checked) {
          try {
            addBeneficiary({name: recipient, bank: bank, account: account});
            Toast.success('Beneficiary saved');
          } catch(e) {
            // Beneficiary might already exist, that's ok
          }
        }
        
        Toast.success('Transfer successful! 🎉');
        setTimeout(() => location.href = 'reciep_printout.html', 500);
      } catch(err) {
        transferMsg.textContent = err.message;
        transferMsg.classList.remove('hidden');
        Toast.error(err.message);
      }
    });
  </script>
</body>
</html>
