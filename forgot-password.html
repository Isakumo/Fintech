<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
  <div id="navbar"></div>
  <div class="w-full max-w-md p-6 mx-auto">
    <h2 class="text-lg font-semibold mb-4">Reset Password</h2>
    <div id="step1" class="bg-white p-4 rounded shadow">
      <label class="block text-sm">Email or Phone</label>
      <input id="identifier" class="mt-1 block w-full rounded border px-3 py-2">
      <div class="mt-3 flex gap-2"><button id="sendCode" class="px-3 py-2 bg-green-600 text-white rounded">Send Code</button><a href="login.html" class="px-3 py-2 border rounded">Back</a></div>
      <div id="sentMsg" class="text-sm text-slate-600 mt-2"></div>
    </div>

    <div id="step2" class="hidden bg-white p-4 rounded shadow mt-4">
      <label class="block text-sm">Enter Code</label>
      <input id="code" class="mt-1 block w-full rounded border px-3 py-2">
      <label class="block text-sm mt-3">New Password</label>
      <input id="newpw" type="password" class="mt-1 block w-full rounded border px-3 py-2">
      <label class="block text-sm mt-3">Confirm Password</label>
      <input id="newpw2" type="password" class="mt-1 block w-full rounded border px-3 py-2">
      <div id="resetMsg" class="text-sm text-red-600 mt-2"></div>
      <div class="mt-3"><button id="resetBtn" class="px-3 py-2 bg-green-600 text-white rounded">Reset Password</button></div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    loadComponent('components/navbar.html','#navbar');
    document.getElementById('sendCode').addEventListener('click', ()=>{
      const id = document.getElementById('identifier').value.trim();
      if(!id) return alert('Enter email or phone');
      const code = sendResetCode(id);
      document.getElementById('sentMsg').textContent = 'Reset code sent (for demo: '+code+')';
      document.getElementById('step2').classList.remove('hidden');
    });
    document.getElementById('resetBtn').addEventListener('click', async ()=>{
      const id = document.getElementById('identifier').value.trim();
      const code = document.getElementById('code').value.trim();
      const pw = document.getElementById('newpw').value; const pw2 = document.getElementById('newpw2').value;
      const msg = document.getElementById('resetMsg'); msg.textContent='';
      if(pw!==pw2){ msg.textContent='Passwords do not match'; return; }
      if(!verifyResetCode(id, code)){ msg.textContent='Invalid or expired code'; return; }
      try{ await resetPassword(id, pw); alert('Password reset. You may login now.'); location.href='login.html'; }catch(err){ msg.textContent = err.message; }
    });
  </script>
</body>
</html>
