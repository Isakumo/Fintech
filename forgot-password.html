<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password - Axpress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
  <div id="navbar"></div>
  <div class="w-full max-w-md p-6 mx-auto">
    <h2 class="text-lg font-semibold mb-4">Reset Password</h2>
    
    <!-- Step 1: Request Reset Code -->
    <div id="step1" class="bg-white p-4 rounded shadow">
      <label class="block text-sm font-medium mb-2">Email or Phone</label>
      <input id="identifier" class="mt-1 block w-full rounded border px-3 py-2" placeholder="Enter email or phone">
      <div class="mt-3 flex gap-2">
        <button id="sendCode" class="px-3 py-2 bg-green-600 text-white rounded hover:bg-green-700">Send Code</button>
        <a href="login.html" class="px-3 py-2 border rounded hover:bg-slate-50">Back</a>
      </div>
      <div id="sentMsg" class="text-sm text-green-600 mt-2"></div>
      <div id="step1Error" class="text-sm text-red-600 mt-2"></div>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="step2" class="hidden bg-white p-4 rounded shadow mt-4">
      <label class="block text-sm font-medium mb-2">Enter Code</label>
      <input id="code" class="mt-1 block w-full rounded border px-3 py-2" placeholder="6-digit code">
      
      <label class="block text-sm font-medium mt-3 mb-2">New Password</label>
      <input id="newpw" type="password" class="mt-1 block w-full rounded border px-3 py-2" placeholder="Minimum 6 characters">
      
      <label class="block text-sm font-medium mt-3 mb-2">Confirm Password</label>
      <input id="newpw2" type="password" class="mt-1 block w-full rounded border px-3 py-2" placeholder="Confirm password">
      
      <div id="resetMsg" class="text-sm text-red-600 mt-3"></div>
      <div class="mt-3">
        <button id="resetBtn" class="px-3 py-2 bg-green-600 text-white rounded hover:bg-green-700">Reset Password</button>
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    loadComponent('components/navbar.html','#navbar');
    
    document.getElementById('sendCode').addEventListener('click', ()=>{
      clearAllErrors();
      const id = document.getElementById('identifier').value.trim();
      const step1Error = document.getElementById('step1Error');
      const sentMsg = document.getElementById('sentMsg');
      step1Error.textContent = '';
      sentMsg.textContent = '';
      
      try {
        if (!id) throw new Error('Please enter email or phone');
        
        const code = sendResetCode(id);
        sentMsg.textContent = '✓ Reset code sent! (Demo: ' + code + ')';
        sentMsg.classList.remove('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('code').focus();
        Toast.info('Reset code sent to ' + id);
      } catch(err) {
        step1Error.textContent = err.message;
        Toast.error(err.message);
      }
    });
    
    document.getElementById('resetBtn').addEventListener('click', async ()=>{
      clearAllErrors();
      const id = document.getElementById('identifier').value.trim();
      const code = document.getElementById('code').value.trim();
      const pw = document.getElementById('newpw').value;
      const pw2 = document.getElementById('newpw2').value;
      const msg = document.getElementById('resetMsg');
      msg.textContent='';
      
      try {
        if (!code) throw new Error('Please enter the reset code');
        
        const pwVal = Validators.password(pw);
        if (!pwVal.isValid) {
          setFieldError('newpw', pwVal.error);
          throw new Error(pwVal.error);
        }
        
        const matchVal = Validators.passwordMatch(pw, pw2);
        if (!matchVal.isValid) {
          setFieldError('newpw2', matchVal.error);
          throw new Error(matchVal.error);
        }
        
        verifyResetCode(id, code);
        await resetPassword(id, pw);
        
        Toast.success('Password reset successfully!');
        setTimeout(() => location.href = 'login.html', 1000);
      } catch(err) {
        msg.textContent = err.message;
        Toast.error(err.message);
      }
    });
  </script>
</body>
</html>
